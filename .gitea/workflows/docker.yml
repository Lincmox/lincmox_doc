name: Build & Push Docker Image

on:
  push:
    branches: [main, develop]
    tags: ["*"]


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Image Name
        id: image
        run: |
          RAW_NAME="${{ vars.REGISTRY_DOMAIN }}/${{ gitea.repository_owner }}/documentation"
          echo "name=${RAW_NAME,,}" >> "$GITHUB_OUTPUT"
          echo "ghcr_name=ghcr.io/lincmox/documentation" >> "$GITHUB_OUTPUT"

      # -------------------
      # Build tools
      # -------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------------------
      # Login registry
      # -------------------
      - name: Login to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_DOMAIN }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.ACCESS_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      # -------------------
      # Build & Push Docker image
      # -------------------
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.tag.outputs.tag }}
            ${{ steps.image.outputs.name }}:0.1.1
            ${{ steps.image.outputs.ghcr_name }}:${{ steps.tag.outputs.tag }}