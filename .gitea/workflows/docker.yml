name: Build & Push Docker Image

on:
  push:
    branches:
      - dev
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image version
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=nightly" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Image Name
        id: image
        run: |
          RAW_NAME="${{ vars.REGISTRY_DOMAIN }}/${{ gitea.repository_owner }}/documentation"
          echo "name=${RAW_NAME,,}" >> "$GITHUB_OUTPUT"
          echo "ghcr_name=ghcr.io/lincmox/documentation" >> "$GITHUB_OUTPUT"

      - name: Build image tags
        id: imagetags
        run: |
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "${{ steps.image.outputs.name }}:${{ steps.tag.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "${{ steps.image.outputs.ghcr_name }}:${{ steps.tag.outputs.version }}" >> "$GITHUB_OUTPUT"
          if [[ "${{ steps.tag.outputs.is_tag }}" == "true" ]]; then
            echo "${{ steps.image.outputs.name }}:latest" >> "$GITHUB_OUTPUT"
            echo "${{ steps.image.outputs.ghcr_name }}:latest" >> "$GITHUB_OUTPUT"
          fi
          echo "EOF" >> "$GITHUB_OUTPUT"

      # -------------------
      # Build tools
      # -------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------------------
      # Login registry
      # -------------------
      - name: Login to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_DOMAIN }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.ACCESS_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      # -------------------
      # Build & Push Docker image
      # -------------------
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.imagetags.outputs.tags }}

  deploy:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

            cd /home/ubuntu/docker/lincmox

            docker compose pull
            docker compose up -d --force-recreate