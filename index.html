<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lincmox</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
  <!-- Prism.js syntax highlighting (light theme, overridden for dark via CSS) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1/themes/prism-tomorrow.min.css" id="prism-theme" />
</head>
<body>

  <!-- Vanta.js animated background (landing page only) -->
  <div id="vanta-bg" aria-hidden="true"></div>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <div class="header-left">
      <button id="menu-toggle" class="menu-toggle" title="Menu" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <a href="#/" class="brand">
        <img id="logo" src="assets/logo.jpg" alt="Logo" class="brand-logo" />
        <div class="brand-info">
          <span id="site-title" class="brand-name">Lincmox Docs</span>
          <span class="brand-subtitle">Documentation</span>
        </div>
      </a>
    </div>

    <div class="header-right">
      <button id="search-toggle" class="search-toggle" title="Search" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <div class="search-wrapper">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search-input" class="search-input" placeholder="Search..." autocomplete="off" />
        <div id="search-results" class="search-results" hidden></div>
      </div>

      <a class="version-badge" href="https://github.com/Lincmox/lincmox_go/releases/tag/v2.0.0" target="_blank" rel="noopener" title="Latest Lincmox release">
        <span class="version-badge-label">Latest</span>
        <span class="version-badge-value">v2.0.0</span>
      </a>

      <button id="theme-toggle" class="theme-toggle" title="Toggle light/dark theme" aria-label="Toggle theme">
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <!-- ===== MAIN LAYOUT ===== -->
  <div class="layout">

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar">
      <div class="section-toggle">
        <button class="toggle-btn active" data-section="functional">Functional</button>
        <button class="toggle-btn" data-section="technical">Technical</button>
      </div>
      <nav id="sidebar-nav" class="sidebar-nav"></nav>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main-content">
      <article id="doc-content" class="doc-body">
        <p class="loading-message">Loading...</p>
      </article>
    </main>

    <!-- ===== TABLE OF CONTENTS ===== -->
    <aside class="toc-sidebar">
      <div class="toc-wrapper">
        <p class="toc-title">On this page</p>
        <nav id="toc-nav" class="toc-nav"></nav>
      </div>
    </aside>

  </div>

  <!-- ===== FOOTER ===== -->
  <footer class="site-footer">
    <p>Documentation generated with 🧡 using AI.</p> 
    <p><a href="https://opencode.ai" target="_blank" rel="noopener">Opencode</a>, <a href="https://gemini.google.com" target="_blank" rel="noopener">Google Gemini</a> and <a href="https://claude.ai" target="_blank" rel="noopener">Anthropic Claude</a>.</p>
  </footer>

  <!-- marked.js via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <!-- Prism.js syntax highlighting + autoloader (loads grammars on demand) -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/plugins/autoloader/prism-autoloader.min.js"></script>
  <!-- Mermaid.js diagrams -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <!-- Vanta.js Dots background (landing page) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.dots.min.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
